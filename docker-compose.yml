version: '3.8'

services:
  hotel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-gemini
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT:-8088}:${PORT:-8088}"
    environment:
      - PORT=${PORT:-8088}
      - DB_PATH=/app/data/hotel.db
      - JWT_SECRET=${JWT_SECRET:-hotel_gemini_production_jwt_key_2026}
      - BOSS_USERNAME=${BOSS_USERNAME:-boss}
      - BOSS_PASSWORD=${BOSS_PASSWORD:-boss12345}
      - BOSS_NAME=${BOSS_NAME:-酒店老板}
    volumes:
      # 持久化存储 SQLite 数据库文件
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:' + (process.env.PORT || 8088) + '/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s